# Demo configuration — runs entirely on the bundled fixtures, no servers needed.
# For live systems, switch each adapter's type and point the *_env keys at
# environment variables holding credentials (never put credentials here).

intent = "examples/intent.toml"
audit_log = "audit.jsonl"

# F8 — 실행마다 한 파일. 경로는 이 설정 파일 기준 상대경로라, 설정을 저장소 밖
# (권장: ~/.config/grantline/grantline.toml) 에 두면 스냅샷도 자동으로 저장소 밖에 쌓인다.
# 스케줄러는 없다 — 간격은 당신이 실행한 만큼이고, 도구는 그 경과를 그대로 말한다.
snapshots = "snapshots"

[adapters.postgres]
type = "fixture"
fixture = "examples/fixtures/postgres.json"
# live:
# type = "postgres"
# dsn_env = "GRANTLINE_PG_DSN"              # read-only role, used by plan/serve
# admin_dsn_env = "GRANTLINE_PG_ADMIN_DSN"  # writes only (apply --write, console)

[adapters.clickhouse]
type = "fixture"
fixture = "examples/fixtures/clickhouse.json"
# live:
# type = "clickhouse"
# url_env = "GRANTLINE_CH_URL"              # e.g. http://reader:pass@host:8123
# admin_url_env = "GRANTLINE_CH_ADMIN_URL"  # writes only (apply --write, console)

# S3 has two auth planes; `enforced` names the one the gateway actually
# consults — grants (and writes) come from that plane, the other is read only
# for cross-plane identity checks. Each plane block carries its OWN endpoint
# and credentials: keys are paired to their plane, and a key from one plane
# fails against the other's endpoint as a misleading 403.
[adapters.s3]
type = "s3"
enforced = "dynamic"

[adapters.s3.planes.static]
file = "examples/fixtures/s3_static.json"

[adapters.s3.planes.dynamic]
file = "examples/fixtures/s3_dynamic.json"
# live (SeaweedFS-style HTTP config object, GET/PUT). 읽기와 쓰기는 다른 자격을
# 쓴다 — postgres 의 admin_dsn_env, clickhouse 의 admin_url_env 와 같은 모양이다.
# admin_* 가 없으면 이 플레인은 읽기 전용이고, 읽기 자격으로 대신 쓰지 않는다.
# url_env = "GRANTLINE_S3_IAM_URL"                # 관찰용 엔드포인트 (GET)
# auth_env = "GRANTLINE_S3_IAM_TOKEN"             # 관찰용 자격 (bearer, 선택)
# admin_url_env = "GRANTLINE_S3_IAM_ADMIN_URL"    # 쓰기 전용 (PUT)
# admin_auth_env = "GRANTLINE_S3_IAM_ADMIN_TOKEN" # 쓰기 전용 자격 (bearer, 선택)

# ── 승인 흐름 (데모) ───────────────────────────────────────────────────────
# 요청은 config 가 지목한 사람들이 승인해야 실행된다. admin 은 모든 요청에, rules 는
# "system:resource" 가 패턴에 맞을 때 더해진다. Slack 봇 토큰이 없으면 운영자가 `request --links ID`로 링크를 안전하게 전달한다.
[approvals]
store = "approvals"
console_url = "http://127.0.0.1:8420"
admin = ["carol"]
[[approvals.rules]]
match = ["postgres:*analytics*", "s3:bucket:data-lake*"]
approvers = ["alice"]

