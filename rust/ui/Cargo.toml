[package]
name = "grantline-ui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
[lib]
crate-type = ["cdylib", "rlib"]
[features]
default = []
ssr = ["leptos/ssr"]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys", "dep:console_error_panic_hook"]
[dependencies]
leptos = { version = "0.8.22", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
wasm-bindgen = { version = "0.2.129", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Document", "Element", "HtmlElement", "Location", "MediaQueryList", "Request", "RequestInit", "RequestCredentials", "Response", "Headers", "Url", "UrlSearchParams", "HtmlDocument", "HtmlCanvasElement", "CanvasRenderingContext2d", "HtmlImageElement", "ImageData", "CssStyleDeclaration", "DomRect", "Event", "EventTarget", "MouseEvent", "PointerEvent", "WheelEvent", "KeyboardEvent", "CustomEvent", "CustomEventInit", "Performance", "ResizeObserver", "MutationObserver", "MutationObserverInit", "WebGl2RenderingContext", "WebGlBuffer", "WebGlShader", "WebGlProgram", "WebGlUniformLocation", "WebGlVertexArrayObject", "WebGlTexture", "WebGlQuery", "Path2d", "DomTokenList"] }
