[package]
name = "grantline-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Grantline Rust migration: native permission core and Leptos approval playground"

[dependencies]
grantline-ui = { path = "ui", features = ["ssr"] }
axum = { version = "0.8", features = ["form", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
leptos = { version = "0.8.22", features = ["ssr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
glob = "0.3"
regex = "1"
tempfile = "3"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
uuid = { version = "1", features = ["v4"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
url = "2"
percent-encoding = "2"
futures-util = "0.3"
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring", "webpki-roots"] }
hmac = "0.12"
roxmltree = "0.21"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
base64 = "0.23"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[workspace]
members = ["ui"]
default-members = ["."]
resolver = "2"
