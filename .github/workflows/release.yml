name: release image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      tag: ${{ steps.source.outputs.tag }}
      stable: ${{ steps.source.outputs.stable }}
    steps:
      - name: Validate published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 -c 'import os,re; t=os.environ["RELEASE_TAG"]; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?",t) and len(t)<=128'
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName > release.json
          python3 -c 'import json; r=json.load(open("release.json")); assert not r["isDraft"]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          path: source
      - name: Pin release source
        id: source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          echo "revision=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          python3 -c 'import json; r=json.load(open("release.json")); print("stable="+str(not r["isPrerelease"]).lower())' >> "$GITHUB_OUTPUT"

  test:
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.source.outputs.revision }}

  native:
    needs: source
    uses: ./.github/workflows/rust.yml
    with:
      source_ref: ${{ needs.source.outputs.revision }}

  build:
    needs: [source, test, native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.source.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ needs.source.outputs.revision }}
            org.opencontainers.image.version=${{ needs.source.outputs.tag }}
      - name: Build native platform and stage by digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=release-${{ matrix.arch }}
            type=gha,scope=native-image
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Smoke the staged image on its native architecture
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          node scripts/check_rust_image.mjs "$IMAGE@$DIGEST"
      - name: Record verified platform digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    needs: [source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish verified multi-platform index
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.source.outputs.tag }}
          STABLE: ${{ needs.source.outputs.stable }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Refusing to overwrite published version $VERSION" >&2
            exit 1
          fi
          digests=("$RUNNER_TEMP"/digests/*)
          test "${#digests[@]}" -eq 2
          refs=()
          for file in "${digests[@]}"; do
            digest="${file##*/}"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
            refs+=("$IMAGE@sha256:$digest")
          done
          tags=(--tag "$IMAGE:$VERSION")
          if [ "$STABLE" = true ]; then tags+=(--tag "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
