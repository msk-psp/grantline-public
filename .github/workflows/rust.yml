name: Rust native
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ""
  push:
    branches: [main]
  pull_request:


permissions:
  contents: read

concurrency:
  group: native-${{ inputs.source_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Format, lint, test and build native binary
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo build --locked
      - name: Build and verify the Leptos browser bundle
        run: |
          rustup target add --toolchain 1.99.0 wasm32-unknown-unknown
          cargo +1.99.0 install --locked wasm-bindgen-cli --version 0.2.129
          scripts/build_rust_ui.sh
          node scripts/check_rust_ui.mjs
          node scripts/check_rust_graph.mjs --check --port 0
          python3 scripts/check_rust_console_details.py
      - name: Compare native contracts with the isolated test reference
        run: |
          python3 scripts/check_rust_parity.py
          python3 scripts/check_rust_core.py
          python3 scripts/check_rust_s3.py
      - name: Verify parallel cache, private configuration, TLS and drift notification
        run: python3 scripts/check_rust_runtime.py
      - name: Verify Filer identity writes and explicit S3 Write probes
        run: |
          python3 scripts/check_rust_filer_writer.py
          python3 scripts/check_rust_write_probe.py
      - name: Verify expanded PostgreSQL and ClickHouse privilege parity
        run: |
          python3 scripts/check_rust_writer_parity.py --kind pg
          python3 scripts/check_rust_writer_parity.py --kind ch
      - name: Verify native ClickHouse reader against isolated HTTP and official server
        run: python3 scripts/check_rust_clickhouse.py --docker
      - name: Verify native PostgreSQL reader against isolated official server
        run: python3 scripts/check_rust_postgres.py --docker
      - name: Verify PostgreSQL 18 column observation against isolated pg_duckdb
        run: python3 scripts/check_rust_postgres.py --docker --image pgduckdb/pgduckdb:18-main@sha256:7fd0a59aa577b4839124b9141f81b7d59162228984cdfa1ffcc8da433d297569
      - name: Verify native S3 readers against isolated HTTP and official SeaweedFS
        run: python3 scripts/check_rust_s3_network.py --docker
      - name: Verify native S3 subject probes against isolated HTTP and official SeaweedFS
        run: python3 scripts/check_rust_s3_probes.py --docker
      - name: Verify native local S3 IAM grant, revoke and restore with official SeaweedFS
        run: python3 scripts/check_rust_s3_writer.py --docker
      - name: Verify native PostgreSQL table/schema/database ACL writer, inverse review and full rollback
        run: python3 scripts/check_rust_postgres_writer.py --docker
      - name: Verify canonical cluster-wide PostgreSQL role membership writes and rollback
        run: python3 scripts/check_rust_postgres_membership.py --docker
      - name: Verify creator-specific default table privileges, future objects and rollback
        run: python3 scripts/check_rust_postgres_defaults.py --docker
      - name: Verify single-statement ClickHouse table writer and uncertain outcomes
        run: python3 scripts/check_rust_clickhouse_writer.py --docker
      - name: Verify single-statement ClickHouse database writer and future table scope
        run: python3 scripts/check_rust_clickhouse_database.py --docker
      - name: Verify canonical ClickHouse membership writer, inverses and uncertain outcomes
        run: python3 scripts/check_rust_clickhouse_membership.py --docker
      - name: Verify conditional remote IAM writes and private recovery
        run: python3 scripts/check_rust_remote_writer.py
      - name: Verify native OIDC signatures, PKCE, session and callback security
        run: node scripts/check_rust_oidc.mjs
      - name: Verify durable approvals and signed Slack to GitHub code publication
        run: node scripts/check_rust_workflow.mjs
      - name: Verify offline state migration and interrupted publication recovery
        run: node scripts/check_rust_migration.mjs

  image:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: grantline-rust-ci:local
          cache-from: type=gha,scope=native-image
          cache-to: type=gha,mode=max,scope=native-image
      - name: Smoke native image without Python or writable root
        run: node scripts/check_rust_image.mjs
