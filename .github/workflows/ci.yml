name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[postgres,dev]"
      - run: ruff check grantline tests
      - run: ruff format --check grantline tests || true   # advisory until the tree is formatted once
      - run: python tests/run.py
      - run: node tests/test_map_hover.mjs
      # The bundled fixture is the end-to-end check: observe, diff, print a plan.
      - run: grantline -c grantline.toml plan
