name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check new source and commit identities
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE" ] && [ -n "$PR_HEAD" ]; then
            python3 scripts/privacy_gate.py --range "$PR_BASE" "$PR_HEAD"
          elif [ -n "$PUSH_BASE" ] && [ "$PUSH_BASE" != 0000000000000000000000000000000000000000 ]; then
            python3 scripts/privacy_gate.py --range "$PUSH_BASE" "$HEAD_SHA"
          else
            # Initial push or reusable workflow without a trusted base: fail closed.
            python3 scripts/privacy_gate.py --initial "$HEAD_SHA"
          fi

      - name: Verify privacy gate regressions
        run: python3 tests/test_privacy_gate.py
      - name: Verify native distribution boundaries
        run: python3 tests/test_native_distribution.py
