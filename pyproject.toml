[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# The code keeps deliberate one-liners (`a; b` on one line where the two are one
# thought) and long prose lines inside HTML and comments. Those are style, not defects.
ignore = ["E501", "E701", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/reference/*" = ["E402"]   # sys.path insert before the package import, on purpose
